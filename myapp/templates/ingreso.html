{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso - MESIAS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-900 font-serif">

    <!-- Layout: Sidebar and Main Content -->
    <div class="flex h-screen">

        <!-- Sidebar -->
        <aside class="bg-gray-900 text-white w-64 h-full fixed top-0 left-0 pt-10 px-4">
            <!-- Logo -->
            <div class="flex justify-center mb-8">
                <img src="{% static 'images/logomesias.png' %}" alt="Logo MESIAS" class="h-10">
            </div>

            <!-- Divider -->
            <hr class="border-gray-700 mb-6">

            <!-- Navigation -->
            <nav>
                <ul>
                    <!-- Dashboard -->
                    <li>
                        <a href="#" class="flex items-center gap-3 p-3 rounded-md hover:bg-gray-700">
                            <i class="bi bi-house-door"></i> Dashboard
                        </a>
                    </li>
                    <!-- Profile -->
                    <li>
                        <a href="#" class="flex items-center gap-3 p-3 rounded-md hover:bg-gray-700">
                            <i class="bi bi-person"></i> Perfil
                        </a>
                    </li>
                    <!-- Reports -->
                    <li>
                        <a href="#" class="flex items-center gap-3 p-3 rounded-md hover:bg-gray-700">
                            <i class="bi bi-file-earmark-text"></i> Informes
                        </a>
                    </li>
                    <!-- Projects -->
                    <li>
                        <a href="#" class="flex items-center gap-3 p-3 rounded-md hover:bg-gray-700">
                            <i class="bi bi-card-list"></i> Proyectos
                        </a>
                    </li>
                    <!-- Virtual Assistant -->
                    <li>
                        <a href="#" class="flex items-center gap-3 p-3 rounded-md hover:bg-gray-700">
                            <i class="bi bi-robot"></i> Asistente Virtual
                        </a>
                    </li>
                    <!-- Recommendations -->
                    <li>
                        <a href="#" class="flex items-center gap-3 p-3 rounded-md hover:bg-gray-700">
                            <i class="bi bi-lightbulb"></i> Recomendaciones
                        </a>
                    </li>
                    <!-- Divider -->
                    <hr class="border-gray-700 my-4">
                    <!-- Logout -->
                    <li>
                        <a href="{% url 'logout' %}" class="flex items-center gap-3 p-3 rounded-md hover:bg-gray-700">
                            <i class="bi bi-box-arrow-right"></i> Salir
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 ml-64 p-6 bg-gray-900">

            <!-- Cards Section -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Card 1: Total Evaluaciones -->
                <div class="bg-gray-800 p-6 rounded-lg text-white flex items-center justify-between">
                    <div>
                        <h3 class="text-xl font-semibold">Total Evaluaciones</h3>
                        <p class="text-2xl font-bold">10</p>
                    </div>
                    <div class="text-4xl text-gray-400">
                        <i class="bi bi-pencil"></i>
                    </div>
                </div>

                <!-- Card 2: Total de Riesgos -->
                <div class="bg-gray-800 p-6 rounded-lg text-white flex items-center justify-between">
                    <div>
                        <h3 class="text-xl font-semibold">Total de Riesgos</h3>
                        <p class="text-2xl font-bold">20</p>
                    </div>
                    <div class="text-4xl text-gray-400">
                        <i class="bi bi-eye"></i>
                    </div>
                </div>
            </div>

            <!-- Chart Section -->
            <div class="mt-12 max-w-full overflow-x-auto">
                <div class="w-full max-w-4xl mx-auto bg-gray-800 p-6 rounded-lg">
                    <canvas id="usageChart"></canvas>
                </div>
            </div>

        </main>
    </div>

    <script>
        // Chart.js setup for scatter plot
        const ctx = document.getElementById('usageChart').getContext('2d');
        const usageChart = new Chart(ctx, {
            type: 'scatter', // Cambiado a gráfico de puntos
            data: {
                datasets: [{
                    label: 'Frecuencia de Uso',
                    data: [
                        { x: 1, y: 12 },
                        { x: 2, y: 19 },
                        { x: 3, y: 3 },
                        { x: 4, y: 5 },
                        { x: 5, y: 2 },
                        { x: 6, y: 3 }
                    ], // Datos de puntos
                    backgroundColor: 'rgba(255, 99, 132, 1)',
                    borderColor: 'rgba(255, 99, 132, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,  // Asegura que el gráfico sea responsivo
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: 'Mes'
                        }
                    },
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Frecuencia'
                        }
                    }
                }
            }
        });
    </script>

</body>

</html>
