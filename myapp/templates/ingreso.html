{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evaluaciones – MESIAS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link rel="shortcut icon" href="{% static 'images/icon.jpeg' %}" type="image/jpeg">
  <style>
    @layer utilities {
      .gradient-text {
        background: linear-gradient(45deg, #4F46E5, #EC4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100">
  <div class="flex h-screen overflow-hidden">
    {% include 'lateral.html' %}

    <main class="flex-1 ml-0 md:ml-64 overflow-auto p-4 md:p-8">
      <div class="max-w-7xl mx-auto space-y-6 md:space-y-8">

        <!-- Título -->
        <h1 class="text-3xl md:text-4xl font-bold text-center gradient-text mb-8">
          Dashboard Analítico
        </h1>

                <!-- Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
          <div class="bg-gradient-to-br from-indigo-800 to-indigo-900 p-5 md:p-6 rounded-xl shadow-2xl hover:translate-y-[-4px] transition-all duration-300">
            <div class="flex justify-between items-center">
              <div>
                <p class="text-sm md:text-base text-indigo-200 mb-1">Total Evaluaciones</p>
                <p class="text-3xl md:text-4xl font-bold text-white">{{ total_evals }}</p>
              </div>
              <i class="bi bi-clipboard-data text-3xl md:text-4xl text-indigo-300"></i>
            </div>
          </div>

          <div class="bg-gradient-to-br from-rose-800 to-pink-900 p-5 md:p-6 rounded-xl shadow-2xl hover:translate-y-[-4px] transition-all duration-300">
            <div class="flex justify-between items-center">
              <div>
                <p class="text-sm md:text-base text-rose-200 mb-1">Pendientes (Fase 2)</p>
                <p class="text-3xl md:text-4xl font-bold text-white">{{ fase2_pendientes }}</p>
              </div>
              <i class="bi bi-hourglass-split text-3xl md:text-4xl text-rose-300"></i>
            </div>
          </div>

          <div class="bg-gradient-to-br from-emerald-800 to-teal-900 p-5 md:p-6 rounded-xl shadow-2xl hover:translate-y-[-4px] transition-all duration-300">
            <div class="flex justify-between items-center">
              <div>
                <p class="text-sm md:text-base text-emerald-200 mb-1">Completadas (Fase 3)</p>
                <p class="text-3xl md:text-4xl font-bold text-white">{{ fase3_completadas }}</p>
              </div>
              <i class="bi bi-check2-circle text-3xl md:text-4xl text-emerald-300"></i>
            </div>
          </div>
        </div>

        <!-- Gráficos ajustados -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 md:gap-6">

          <!-- Evolución últimos 6 meses -->
          <div class="bg-gray-800/50 backdrop-blur-sm p-4 md:p-6 rounded-xl border border-gray-700 hover:border-indigo-500 transition-all h-[400px]">
            <h2 class="text-lg md:text-xl font-semibold mb-4 flex items-center gap-2">
              <i class="bi bi-bar-chart-line text-indigo-400"></i>
              Actividad últimos 6 meses
            </h2>
            <div class="h-[calc(100%-56px)]"> <!-- 56px = altura del título -->
              <canvas id="usageChart" class="w-full h-full"></canvas>
            </div>
          </div>

          <!-- Por fase -->
          <div class="bg-gray-800/50 backdrop-blur-sm p-4 md:p-6 rounded-xl border border-gray-700 hover:border-emerald-500 transition-all h-[400px]">
            <h2 class="text-lg md:text-xl font-semibold mb-4 flex items-center gap-2">
              <i class="bi bi-pie-chart text-emerald-400"></i>
              Distribución por fase
            </h2>
            <div class="h-[calc(100%-56px)]">
              <canvas id="phaseChart" class="w-full h-full"></canvas>
            </div>
          </div>

          <!-- Por sección de proyecto -->
          <div class="lg:col-span-2 bg-gray-800/50 backdrop-blur-sm p-4 md:p-6 rounded-xl border border-gray-700 hover:border-rose-500 transition-all h-[500px]">
            <h2 class="text-lg md:text-xl font-semibold mb-4 flex items-center gap-2">
              <i class="bi bi-layers text-rose-400"></i>
              Evaluaciones por sección
            </h2>
            <div class="h-[calc(100%-56px)]">
              <canvas id="sectionChart" class="w-full h-full"></canvas>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Configuración común actualizada
    Chart.defaults.color = '#9CA3AF';
    Chart.defaults.borderColor = 'rgba(55, 65, 81, 0.5)';

    // Función para crear gráficos con tamaño responsivo
    function createResponsiveChart(canvasId, config) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      return new Chart(ctx, {
        ...config,
        options: {
          ...config.options,
          responsive: true,
          maintainAspectRatio: false
        }
      });
    }

    // Gráfico mensual
    createResponsiveChart('usageChart', {
      type: 'bar',
      data: {
        labels: {{ meses_labels|safe }},
        datasets: [{
          label: 'Evaluaciones',
          data: {{ meses_data|safe }},
          backgroundColor: 'rgba(99, 102, 241, 0.8)',
          borderRadius: 8,
          borderWidth: 1
        }]
      },
      options: {
        scales: {
          x: {
            grid: { display: false },
            title: { display: true, text: 'Mes' }
          },
          y: {
            beginAtZero: true,
            grid: { color: 'rgba(55, 65, 81, 0.3)' },
            title: { display: true, text: 'Cantidad' }
          }
        }
      }
    });

    // Gráfico por sección
    createResponsiveChart('sectionChart', {
      type: 'bar',
      data: {
        labels: {{ sec_labels|safe }},
        datasets: [{
          label: 'Evaluaciones',
          data: {{ sec_data|safe }},
          backgroundColor: [
            'rgba(244, 114, 182, 0.8)',
            'rgba(56, 189, 248, 0.8)',
            'rgba(74, 222, 128, 0.8)',
            'rgba(250, 204, 21, 0.8)',
            'rgba(139, 92, 246, 0.8)',
            'rgba(249, 115, 22, 0.8)'
          ],
          borderRadius: 8
        }]
      },
      options: {
        indexAxis: 'y',
        scales: {
          x: { grid: { color: 'rgba(55, 65, 81, 0.3)' } },
          y: { grid: { display: false } }
        }
      }
    });

    // Gráfico por fase
    createResponsiveChart('phaseChart', {
      type: 'doughnut',
      data: {
        labels: {{ fase_labels|safe }},
        datasets: [{
          data: {{ fase_data|safe }},
          backgroundColor: [
            'rgba(244, 114, 182, 0.8)',
            'rgba(74, 222, 128, 0.8)',
            'rgba(96, 165, 250, 0.8)'
          ],
          borderWidth: 0
        }]
      },
      options: {
        plugins: {
          legend: { position: 'right' }
        }
      }
    });
  </script>
</body>
</html>
