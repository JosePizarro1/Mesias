{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recomendación - MESIAS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <!-- Cargar Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Cargar Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<!-- Cargar Font Awesome -->
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <!-- Cargar Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<style>
    .custom-icon {
    font-size: 4rem; /* O el tamaño que desees */
}
body {
            font-family: 'Playfair Display', serif;
        }

        .nav-item {
            flex: 1;
            text-align: center;
        }

        .btn-custom {
            background-color: white;
            color: black;
            border: 1px solid black;
        }

        .btn-custom:hover {
            background-color: black;
            color: white;
        }
</style>
<body class="bg-gray-100">
    <!-- Header -->
    <header class="bg-white text-black p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <img src="{% static 'images/logomesias.png' %}" alt="Logo MESIAS" class="h-10">
            <nav class="flex flex-1 justify-between items-center">
                <a href="{% url 'home' %}" class="nav-item hover:text-gray-600">Home</a>
                <a href="#" class="nav-item hover:text-gray-600">Proyectos</a>
                <a href="#" class="nav-item hover:text-gray-600">Test</a>
            </nav>
            <a href="{% url 'login' %}" class="btn btn-custom px-4 py-2">Login</a>
        </div>
    </header>

    <div class="container mt-5">
        <h2 class="text-center">Deja tu Valoracion
            
        </h2>
        <form method="POST" action="{% url 'recomendacion' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="estrellas" class="form-label">Estrellas</label>
                <select name="estrellas" id="estrellas" class="form-control" required>
                    {% for i in "12345" %}
                        <option value="{{ i }}">{{ i }} Estrella{{ i|pluralize:"s" }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="comentario" class="form-label">Comentario</label>
                <textarea name="comentario" id="comentario" class="form-control" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Enviar Recomendación</button>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
