{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Recomendaciones - MESIAS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="shortcut icon" href="{% static 'images/icon.jpeg' %}" type="image/jpeg">
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen">
  {% include 'lateral.html' %}

  <main class="ml-0 md:ml-64 p-8">
    <h1 class="text-3xl font-bold mb-6">Deja tu recomendación</h1>

    <form method="POST" action="{% url 'recomendaciones' %}" class="bg-gray-800 p-6 rounded-lg shadow-lg space-y-4">
      {% csrf_token %}

      <label for="comentario" class="block text-sm text-gray-400">Tu comentario</label>
      <textarea name="comentario" rows="4" class="w-full bg-gray-700 text-white p-3 rounded focus:outline-none" required></textarea>

      <label for="estrellas" class="block text-sm text-gray-400">Calificación</label>
<div class="flex items-center space-x-2" id="star-rating">
  {% for i in "12345" %}
    <label class="cursor-pointer">
      <input type="radio" name="estrellas" value="{{ i }}" class="hidden" required>
      <svg data-star="{{ forloop.counter }}" class="w-8 h-8 text-gray-500 hover:scale-110 transition-transform duration-200" fill="currentColor" viewBox="0 0 20 20">
        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.962a1 1 0 00.95.69h4.166c.969 0 1.371 1.24.588 1.81l-3.37 2.448a1 1 0 00-.364 1.118l1.286 3.962c.3.921-.755 1.688-1.54 1.118l-3.37-2.448a1 1 0 00-1.175 0l-3.37 2.448c-.784.57-1.838-.197-1.539-1.118l1.286-3.962a1 1 0 00-.364-1.118L2.05 9.39c-.783-.57-.38-1.81.588-1.81h4.165a1 1 0 00.951-.69l1.286-3.962z"/>
      </svg>
    </label>
  {% endfor %}
</div>


      <div class="flex justify-end">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-5 py-2 rounded-lg shadow-md">
          Guardar recomendación
        </button>
      </div>
    </form>
  </main>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Mensajes con SweetAlert
    {% if messages %}
      {% for message in messages %}
        Swal.fire({
          icon: "{{ message.tags }}".includes("success") ? "success" : "error",
          title: "{{ message|escapejs }}",
          timer: 2500,
          showConfirmButton: false
        });
      {% endfor %}
    {% endif %}

    // Lógica visual para las estrellas
    const stars = document.querySelectorAll('#star-rating svg');
    const radios = document.querySelectorAll('input[name="estrellas"]');

    stars.forEach(star => {
      star.addEventListener('click', () => {
        const rating = parseInt(star.dataset.star);

        // Marca visualmente hasta la estrella clickeada
        stars.forEach(s => {
          const sNum = parseInt(s.dataset.star);
          if (sNum <= rating) {
            s.classList.remove('text-gray-500');
            s.classList.add('text-yellow-400');
          } else {
            s.classList.remove('text-yellow-400');
            s.classList.add('text-gray-500');
          }
        });

        // Marca el radio correspondiente
        radios[rating - 1].checked = true;
      });
    });
  });
</script>

</body>
</html>
