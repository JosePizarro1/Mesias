{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - MESIAS</title>

    <!-- Cargar Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Cargar Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

    <!-- Cargar Font Awesome -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Cargar Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Playfair Display', serif;
            background-color: white;
            color: black;
        }

        .nav-item {
            flex: 1;
            text-align: center;
        }

        .btn-custom {
            background-color: white;
            color: black;
            border: 1px solid black;
        }

        .btn-custom:hover {
            background-color: black;
            color: white;
        }

        .login-card {
            max-width: 400px;
            padding: 2rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            /* eliminamos margin-auto para que el flex-centering lo ubique */
            margin: 0;
        }

        .login-card h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 1rem;
        }

        .input-group i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }

        input {
            padding-left: 40px;
        }
    </style>
</head>

<body class="flex flex-col min-h-screen font-roboto bg-gray-50">

    {% include 'header.html' %}

    <main class="flex-grow flex items-center justify-center">
        <!-- Formulario de Login -->
        <div class="login-card">
            <h2 class="text-center">Iniciar Sesión</h2>

            {% if messages %}
                <div class="mb-4">
                    {% for message in messages %}
                        <div class="alert {{ message.tags }} p-2 rounded-md mb-2" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" id="username" required class="form-control" placeholder="Usuario">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" id="password" required class="form-control" placeholder="Contraseña">
                </div>
                <button type="submit" class="btn btn-dark w-100">Iniciar Sesión</button>
            </form>

            <p class="mt-4 text-center">
                ¿No tienes una cuenta? <a href="{% url 'register' %}" class="text-decoration-none">Regístrate aquí</a>
            </p>
            <p class="text-center mt-2">
                <a href="{% url 'password_reset' %}" class="text-decoration-none">¿Olvidaste tu contraseña?</a>
            </p>

            <div class="text-center mt-3">
                <a href="{% url 'home' %}" class="btn btn-light w-100">Regresar</a>
            </div>
        </div>
    </main>

    {% include 'footer.html' %}

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
