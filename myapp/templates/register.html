{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - MESIAS</title>

    <!-- Cargar Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Cargar Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

    <!-- Cargar Font Awesome -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Cargar Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            font-family: 'Playfair Display', serif;
            background-color: white;
            color: black;
        }

        .form-card {
            max-width: 400px;
            margin: 2rem auto;
            padding: 2rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .form-card h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .input-group {
            position: relative;
            margin-bottom: 1rem;
        }

        .input-group i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }

        .form-card input {
            padding-left: 40px;
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            padding: 1rem 0;
            border-top: 1px solid #ddd;
            font-size: 0.875rem;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="bg-white text-black p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <img src="{% static 'images/logomesias.png' %}" alt="Logo MESIAS" class="h-10">
            <nav class="flex flex-1 justify-between items-center">
                <a href="{% url 'home' %}" class="nav-item hover:text-gray-600">Home</a>
                <a href="#" class="nav-item hover:text-gray-600">Proyectos</a>
                <a href="#" class="nav-item hover:text-gray-600">Test</a>
            </nav>
            <a href="{% url 'login' %}" class="btn btn-custom px-4 py-2">Login</a>
        </div>
    </header>

    <!-- Mensajes -->
    {% if messages %}
    <div class="container mt-3">
        {% for message in messages %}
        <div class="alert alert-success" role="alert">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Registro -->
    <div class="form-card">
        <h2>Registro de Usuario</h2>
        <form id="registerForm" method="POST" action="{% url 'register' %}">
            {% csrf_token %}
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" class="form-control" id="username" name="username" placeholder="Nombre de usuario" required>
            </div>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" class="form-control" id="email" name="email" placeholder="Correo electrónico" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required>
            </div>
            <button type="button" id="registerBtn" class="btn btn-custom w-100">Registrarse</button>
        </form>

        <p class="text-center mt-3">¿Ya tienes una cuenta? 
            <a href="{% url 'login' %}" class="text-black font-bold">Inicia sesión aquí</a>
        </p>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 MESIAS. Todos los derechos reservados.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('registerBtn').addEventListener('click', function() {
            Swal.fire({
                title: 'Confirmar Registro',
                text: '¿Estás seguro de que los datos son correctos?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Sí, registrar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    document.getElementById('registerForm').submit();
                }
            });
        });
    </script>
</body>

</html>
